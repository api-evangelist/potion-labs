name: Potion Labs
description: 'Potion Labs (which rebranded its engineering org to Ntropika Labs) is a
  decentralized finance team behind Potion Finance / Potion Protocol, an on-chain risk-management
  and options platform on Ethereum. Potion is a "perfectly priced put AMM" — a decentralized
  put-option / DeFi insurance marketplace where liquidity providers earn yield by selling
  downside protection through a proprietary bonding curve based on the Kelly Criterion, while
  buyers get automated routing to the best price across independent liquidity providers. The
  protocol is delivered as Solidity smart contracts with TypeScript/Vue frontends rather than a
  hosted REST API. Backed by Polychain Capital. This profile was surfaced from Polychain''s
  portfolio and enriched from the team''s public GitHub org and website; the project appears
  largely dormant (contracts deployed to the deprecated Ropsten testnet, and potion.fi now serves
  a DeFi blog).'
